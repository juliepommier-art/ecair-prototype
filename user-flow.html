<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECAIR · User flow · Revue par lots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#F4F4F2}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="font-family: Inter, system-ui, sans-serif; color: #1A1A1A; background: #F4F4F2; min-height: 100vh; padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; font-size: 13px; line-height: 1.4">

  <div style="display: flex; flex-direction: column; gap: 6px">
    <span style="align-self: flex-start; background: #E4E4E0; border: 1px solid #C9C9C4; border-radius: 8px; padding: 4px 12px; font-size: 20px; font-weight: 600">User flow cible</span>
    <h1 style="margin: 4px 0 0; font-size: 22px; font-weight: 600">Revue de dossier par lots : plusieurs moments de dépôt, jusqu’à l’envoi au financeur</h1>
    <span style="color: #5C5C57">Les pièces sont déposées à différents moments selon le dossier. À chaque upload, tout le lot est recontrôlé.</span>
  </div>

  <div style="display: grid; grid-template-columns: 200px repeat(7, minmax(0, 1fr)); gap: 12px; align-items: stretch">
    <div></div>
    <div style="grid-column: 2 / -1; background: #1A1A1A; color: #FFFFFF; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 500; clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 50%, calc(100% - 22px) 100%, 0 100%)">Cycle de vie du dossier</div>
    <div></div>
    <div style="border: 1px solid #1A1A1A; border-radius: 14px; padding: 8px 12px; text-align: center; background: #FFFFFF; font-weight: 600; align-self: end">1. Création du dossier</div>
    <div style="grid-column: span 2; display: flex; flex-direction: column; gap: 6px">
      <div style="border: 1px solid #1A1A1A; border-radius: 14px; padding: 8px 12px; text-align: center; background: #FFFFFF; font-weight: 600; background: #EAF0FF">2. Dépôt des pièces</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <div style="border: 1px solid #1A1A1A; border-radius: 14px; padding: 6px 10px; text-align: center; background: #EAF0FF; font-weight: 500; font-size: 12px">Avant travaux</div>
        <div style="border: 1px solid #1A1A1A; border-radius: 14px; padding: 6px 10px; text-align: center; background: #EAF0FF; font-weight: 500; font-size: 12px">Après travaux</div>
      </div>
    </div>
    <div style="border: 1px solid #1A1A1A; border-radius: 14px; padding: 8px 12px; text-align: center; background: #FFFFFF; font-weight: 600; align-self: end">3. Analyse de la cohérence</div>
    <div style="border: 1px solid #1A1A1A; border-radius: 14px; padding: 8px 12px; text-align: center; background: #FFFFFF; font-weight: 600; align-self: end">4. Résolution des problèmes</div>
    <div style="border: 1px solid #1A1A1A; border-radius: 14px; padding: 8px 12px; text-align: center; background: #FFFFFF; font-weight: 600; align-self: end">5. Validation du lot</div>
    <div style="border: 1px solid #1A1A1A; border-radius: 14px; padding: 8px 12px; text-align: center; background: #FFFFFF; font-weight: 600; align-self: end">6. Envoi au financeur</div>
  </div>

  <sc-for list="{{lanes}}" as="lane" hint-placeholder-count="7">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <sc-if value="{{lane.isLine}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; gap: 12px; color: #5C5C57; font-size: 12px; letter-spacing: 0.08em; padding: 4px 0">
          <span style="flex: 1; border-top: 2px dashed #8A8A84"></span>
          LIGNE D’INTERACTION
          <span style="flex: 1; border-top: 2px dashed #8A8A84"></span>
        </div>
      </sc-if>
      <sc-if value="{{lane.isLane}}" hint-placeholder-val="{{ true }}">
        <div style="display: grid; grid-template-columns: 200px repeat(7, minmax(0, 1fr)); gap: 12px; align-items: stretch; background: {{lane.bg}}; border: 1px solid #D6D6D1; border-radius: 14px; padding: 12px">
          <div style="background: #1A1A1A; color: #FFFFFF; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; justify-content: center; gap: 4px; min-height: 110px">
            <span style="font-size: 15px; font-weight: 600">{{lane.name}}</span>
            <span style="font-size: 12px; color: #C9C9C4">{{lane.sub}}</span>
          </div>
          <sc-for list="{{lane.cells}}" as="cell" hint-placeholder-count="7">
            <div style="display: flex; flex-direction: column; gap: 10px">
              <sc-for list="{{cell.items}}" as="it" hint-placeholder-count="2">
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <sc-if value="{{it.isFront}}" hint-placeholder-val="{{ true }}">
                    <div style="{{it.cardStyle}}">
                      <span style="font-weight: 600; color: #FFFFFF">{{it.a}}</span>
                      <sc-if value="{{it.hasV}}" hint-placeholder-val="{{ true }}">
                        <span style="font-size: 12px; color: #C9C9C4">Voit : {{it.v}}</span>
                      </sc-if>
                    </div>
                  </sc-if>
                  <sc-if value="{{it.isBack}}" hint-placeholder-val="{{ false }}">
                    <div style="background: #E4E4E0; border: 1px solid #C9C9C4; border-radius: 6px; padding: 10px 12px; font-weight: 500; color: #2E2E2B">{{it.a}}</div>
                  </sc-if>
                  <sc-if value="{{it.hasT}}" hint-placeholder-val="{{ true }}">
                    <span style="align-self: flex-start; border: 1px solid #1A1A1A; background: #FFFFFF; border-radius: 4px; padding: 3px 8px; font-size: 11px; font-weight: 500">{{it.t}}</span>
                  </sc-if>
                </div>
              </sc-for>
            </div>
          </sc-for>
        </div>
      </sc-if>
    </div>
  </sc-for>

  <div style="display: flex; flex-wrap: wrap; gap: 20px; font-size: 12px; color: #5C5C57; padding-top: 4px">
    <span style="display: flex; align-items: center; gap: 8px"><span style="width: 14px; height: 14px; background: #1A1A1A; border-radius: 3px"></span>Action de l’acteur</span>
    <span style="display: flex; align-items: center; gap: 8px"><span style="width: 14px; height: 14px; background: #1F3A8A; border-radius: 3px"></span>Dépôt guidé (consignes + rappel des infos clés), possible en plusieurs fois</span>
    <span style="display: flex; align-items: center; gap: 8px"><span style="width: 14px; height: 14px; background: #E4E4E0; border: 1px solid #C9C9C4; border-radius: 3px"></span>Action du système, en coulisse</span>
    <span style="display: flex; align-items: center; gap: 8px"><span style="width: 14px; height: 14px; background: #3A3A37; border: 2px dashed #F2B544; border-radius: 3px"></span>Sur alerte uniquement</span>
    <span style="display: flex; align-items: center; gap: 8px"><span style="border: 1px solid #1A1A1A; background: #FFFFFF; border-radius: 4px; padding: 1px 6px; font-size: 11px">Touchpoint</span>Écran ou canal utilisé</span>
  </div>
</div>
</template>
<script>
(function(){
  var HOLE=/\{\{\s*([^}]+?)\s*\}\}/g;
  function resolve(path, scope){ var parts=path.trim().split('.'); var v=scope; for(var i=0;i<parts.length;i++){ if(v==null) return undefined; v=v[parts[i]]; } return v; }
  function interp(str, scope){ return str.replace(HOLE, function(_, p){ var v=resolve(p, scope); return v==null ? '' : String(v); }); }
  function evalHole(str, scope){ if(str==null) return undefined; var m=str.match(/^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/); return m ? resolve(m[1], scope) : str; }
  function renderList(nodes, scope){ var out=[]; for(var i=0;i<nodes.length;i++){ out.push.apply(out, renderNode(nodes[i], scope)); } return out; }
  function renderNode(n, scope){
    if(n.nodeType===3){ return [document.createTextNode(interp(n.nodeValue, scope))]; }
    if(n.nodeType!==1) return [];
    var tag=n.localName;
    if(tag==='sc-for'){ var list=evalHole(n.getAttribute('list'), scope)||[]; var as=n.getAttribute('as')||'item'; var res=[]; for(var i=0;i<list.length;i++){ var sc=Object.create(scope); sc[as]=list[i]; res.push.apply(res, renderList(n.childNodes, sc)); } return res; }
    if(tag==='sc-if'){ return evalHole(n.getAttribute('value'), scope) ? renderList(n.childNodes, scope) : []; }
    var el=document.createElementNS(n.namespaceURI, tag);
    var dv=null;
    for(var a=0;a<n.attributes.length;a++){
      var at=n.attributes[a], name=at.name;
      if(name.indexOf('hint-')===0) continue;
      if(name==='onclick'){ var fn=evalHole(at.value, scope); if(typeof fn==='function') el.addEventListener('click', fn); continue; }
      if(name==='defaultvalue'){ dv=interp(at.value, scope); continue; }
      el.setAttribute(name, interp(at.value, scope));
    }
    var kids=renderList(n.childNodes, scope);
    for(var k=0;k<kids.length;k++) el.appendChild(kids[k]);
    if(dv!=null) el.value=dv;
    return [el];
  }
  window.DCLogic=function(props){ this.props=props||{}; };
  window.DCLogic.prototype.setState=function(patch){ var p=typeof patch==='function'?patch(this.state):patch; this.state=Object.assign({}, this.state, p); window.__dcRender(); };
  window.__dcMount=function(Comp){
    var tpl=document.getElementById('tpl').content;
    var app=document.getElementById('app');
    var comp=new Comp({});
    window.__dcRender=function(){ var nodes=renderList(tpl.childNodes, comp.renderVals()); app.replaceChildren.apply(app, nodes); };
    window.__dcRender();
  };
})();
</script>
<script>
class Component extends DCLogic {
  renderVals() {
    const card = 'background: #1A1A1A; border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px;';
    const cardGuide = 'background: #1F3A8A; border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px;';
    const cardVar = 'background: #3A3A37; border: 2px dashed #F2B544; border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px;';
    const mk = (style) => (a, v, t) => ({ a: a, v: v || '', t: t || '', isFront: true, isBack: false, hasV: !!v, hasT: !!t, cardStyle: style });
    const F = mk(card), G = mk(cardGuide), V = mk(cardVar);
    const B = (a) => ({ a: a, v: '', t: '', isFront: false, isBack: true, hasV: false, hasT: false, cardStyle: '' });
    const lane = (name, sub, cells, bg) => ({ isLane: true, isLine: false, name: name, sub: sub, bg: bg || '#FBFBFA', cells: cells.map((items) => ({ items: items })) });

    const lanes = [
      lane('Chargé de compte', 'Accompagne le Pro et prépare l’envoi', [
        [F('Assiste le commercial sur sa demande après la simulation', 'Simulation et demande de dossier', 'Messagerie · Page projet')],
        [], [], [], [], [],
        [F('Envoie le dossier sans revérification manuelle', 'Lots validés, historique consultable', 'Page projet · Statut du dossier')]
      ]),
      lane('Ops ECAIR', 'Intervient sur alerte', [
        [], [], [],
        [F('Peut à tout moment demander une pièce complémentaire ou passer en revue manuelle', 'Lot, écart et documents', 'Section cohérence du lot · side panel')],
        [V('Fallback : reçoit une alerte après X tentatives et passe en revue manuelle', 'Lot, écart et documents', 'Traitement d’alerte · Section cohérence du lot')],
        [F('Voit le dossier avancer sans action', 'Carte sans alerte', 'Kanban · vue pilotage')],
        []
      ]),
      lane('Système', 'Analyse automatique', [
        [B('Génère la liste des pièces selon la situation')],
        [], [],
        [B('À chaque upload, compare tout le lot à la référence du dossier'), B('Détecte un écart, y compris avec une pièce déjà validée'), B('Envoie une nouvelle demande de justificatifs en fonction de l’erreur')],
        [B('Relance l’analyse de tout le lot à chaque nouveau dépôt'), B('Au bout de X tentatives : propose une question de situation, sinon bascule en revue manuelle')],
        [B('Valide le lot')],
        [B('Vérifie la cohérence complète du dossier')]
      ], '#F7F7F5'),
      { isLane: false, isLine: true, name: '', sub: '', bg: '', cells: [] },
      lane('Commercial Pro', 'Vend et crée le dossier', [
        [F('Saisit les infos du client et répond aux questions de situation', 'Formulaire, infos clés, questions de situation', 'Formulaire de création de projet')],
        [], [], [], [], [], []
      ]),
      lane('Admin Pro', 'Collecte et dépose les pièces', [
        [F('Reçoit la demande de dossier', 'Pièces attendues et infos de référence', 'Section dépôt')],
        [F('Demande les pièces au client', 'Liste des pièces manquantes', 'Page projet · Tâches'), G('Dépose les pièces avant travaux, en une ou plusieurs fois', 'Consignes du document + rappel des infos clés', 'Section dépôt')],
        [G('Dépose les pièces après travaux, en une ou plusieurs fois', 'Consignes du document + rappel des infos clés', 'Section dépôt')],
        [F('Reçoit une réponse instantanée', '« Reçu et conforme » ou l’écart et l’action à faire', 'Section dépôt · retour instantané'), F('Voit l’écart en miroir', 'Badge « 1 écart à résoudre »', 'Section dépôt')],
        [G('Dépose la ou les pièces demandées pour la cohérence du lot', 'Consignes + justificatifs impactés · tentatives 1 à X', 'Section dépôt'), F('Ou corrige une information du dossier', 'Infos de référence modifiables', 'Page projet · Détails du projet'), F('Ou conteste le verdict', '« Ce verdict me semble faux »', 'Section dépôt'), F('Au bout de X tentatives : répond à une question de situation en fonction de l’erreur', 'Par exemple « Votre client a-t-il changé de nom ? », « A-t-il déménagé ? », « Le logement est-il loué ? »', 'Section dépôt')],
        [F('Est informé de la validation', '« Lot validé, prêt pour le financeur »', 'Page projet')],
        [F('Suit l’envoi et le paiement', '« Envoyé au financeur », paiement à recevoir', 'Section dépôt')]
      ]),
      lane('Particulier', 'Fournit ses justificatifs', [
        [],
        [F('Transmet ses justificatifs', 'Liste des documents demandés + infos clés précises à respecter', 'Espace de dépôt client')],
        [F('Transmet les justificatifs après travaux', 'Liste des documents demandés + infos clés précises à respecter', 'Espace de dépôt client')],
        [],
        [F('Fournit la pièce demandée', 'Demande précise de la pièce', 'Espace de dépôt client')],
        [], []
      ])
    ];
    return { lanes: lanes };
  }
}
window.__dcMount(Component);
</script>
</body>
</html>
