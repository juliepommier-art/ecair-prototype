<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECAIR · Vue Pro · Dépôt des pièces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F6F8}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
button{font-family:inherit}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="font-family: Inter, system-ui, -apple-system, sans-serif; color: #101828; background: #F5F6F8; min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch; font-size: 14px; line-height: 1.45">

  <nav aria-label="Navigation principale" style="flex: 1 1 240px; max-width: 100%; background: #FFFFFF; border-right: 1px solid #E4E7EC; padding: 20px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 6px">
      <div style="width: 28px; height: 28px; border-radius: 8px; background: #2659F1; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">E</div>
      <span style="font-weight: 600; font-size: 15px">Avance MaPrimeRénov’</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <a href="#" style="display: flex; justify-content: space-between; align-items: center; padding: 10px; border-radius: 8px; color: #344054; text-decoration: none">Accueil <span style="background: #2659F1; color: #FFFFFF; border-radius: 6px; padding: 1px 7px; font-size: 12px; font-weight: 600">4</span></a>
      <a href="#" style="display: flex; justify-content: space-between; align-items: center; padding: 10px; border-radius: 8px; color: #344054; text-decoration: none">Notifications <span style="background: #2659F1; color: #FFFFFF; border-radius: 6px; padding: 1px 7px; font-size: 12px; font-weight: 600">12</span></a>
      <a href="#" style="display: flex; justify-content: space-between; align-items: center; padding: 10px; border-radius: 8px; background: #F2F4F7; color: #101828; font-weight: 600; text-decoration: none">Projets <span style="color: #5B6474; font-size: 12px; font-weight: 500">12</span></a>
      <a href="#" style="padding: 10px; border-radius: 8px; color: #344054; text-decoration: none">MARs</a>
      <a href="#" style="padding: 10px; border-radius: 8px; color: #344054; text-decoration: none">Utilisateurs</a>
    </div>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; padding: 24px 40px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 13px; color: #5B6474">Projets  /  <span style="color: #101828; font-weight: 500">Marie Dupont</span></div>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
        <h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.01em">Marie Dupont</h1>
        <span style="color: #5B6474">Rénovation d’ampleur · 16 900 € à financer</span>
      </div>
    </div>

    <div role="tablist" aria-label="Vues du projet" style="display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid #E4E7EC">
      <button type="button" role="tab" aria-selected="true" style="background: transparent; border: 0; border-bottom: 2px solid #101828; padding: 0 14px; height: 44px; font-size: 14px; font-weight: 600; color: #101828; cursor: pointer">Dépôt des pièces</button>
      <button type="button" role="tab" aria-selected="false" style="background: transparent; border: 0; padding: 0 14px; height: 44px; font-size: 14px; font-weight: 500; color: #5B6474; cursor: pointer">Détails du projet</button>
      <button type="button" role="tab" aria-selected="false" style="background: transparent; border: 0; padding: 0 14px; height: 44px; font-size: 14px; font-weight: 500; color: #5B6474; cursor: pointer">Messages</button>
    </div>

    <section aria-labelledby="lot-title" style="background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 14px; overflow: hidden">
      <div style="padding: 20px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid #EAECF0">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <h2 id="lot-title" style="margin: 0; font-size: 18px; font-weight: 600">Lot Particulier · avant travaux</h2>
          <span style="color: #5B6474; font-size: 13px">Pièces du client et de son logement, contrôlées ensemble à chaque dépôt</span>
        </div>
        <span style="font-size: 13px; color: #344054; font-weight: 500">{{progress}}</span>
      </div>

      <sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
        <div role="status" style="padding: 18px 24px; display: flex; gap: 12px; align-items: flex-start; border-bottom: 1px solid #EAECF0">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17804A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="10"></circle><path d="m8 12 3 3 5-6"></path></svg>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-weight: 600">Lot Particulier validé</span>
            <span style="color: #475467">Toutes les pièces sont cohérentes entre elles. Il est prêt pour l’envoi au financeur.</span>
          </div>
        </div>
      </sc-if>

      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div style="border-bottom: 1px solid #F2F4F7">
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 24px; min-height: 44px">
            <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
              <span style="font-weight: 500">{{r.name}}</span>
              <span style="font-size: 12px; color: #667085">{{r.meta}}</span>
            </div>
            <sc-if value="{{r.isOk}}" hint-placeholder-val="{{ true }}">
              <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #17804A; font-weight: 500"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#17804A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>{{r.status}}</span>
            </sc-if>
            <sc-if value="{{r.isWarn}}" hint-placeholder-val="{{ false }}">
              <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #B54708; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F79009"></span>{{r.status}}</span>
            </sc-if>
            <sc-if value="{{r.isWait}}" hint-placeholder-val="{{ false }}">
              <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #344054; font-weight: 500"><span style="width: 8px; height: 8px; border-radius: 50%; border: 2px solid #98A2B3; box-sizing: border-box"></span>{{r.status}}</span>
            </sc-if>
          </div>

          <sc-if value="{{r.isAvis}}" hint-placeholder-val="{{ false }}">
            <sc-if value="{{isStart}}" hint-placeholder-val="{{ true }}">
              <div style="margin: 0 24px 20px; border: 1px solid #E4E7EC; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 18px">
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <span style="font-size: 12px; font-weight: 600; color: #667085; text-transform: uppercase; letter-spacing: 0.04em">Ce qui est attendu</span>
                  <span style="color: #475467">Avis d’imposition 2025 sur les revenus 2024, toutes les pages, lisible.</span>
                  <span style="color: #475467">Informations qui doivent y figurer : <span style="color: #101828; font-weight: 600">Marie Dupont</span> · <span style="color: #101828; font-weight: 600">3 personnes</span> dans le foyer</span>
                </div>
                <div style="border: 1.5px dashed #98A2B3; border-radius: 12px; padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
                  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#475467" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"></path><path d="m7 9 5-5 5 5"></path><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path></svg>
                  <span style="color: #344054">Glissez l’avis d’imposition ici</span>
                  <button type="button" onClick="{{uploadAvis}}" style="background: #101828; color: #FFFFFF; border: 0; border-radius: 8px; padding: 0 18px; height: 44px; font-weight: 600; font-size: 14px; cursor: pointer">Choisir un fichier</button>
                </div>
              </div>
            </sc-if>
            <sc-if value="{{isAnalyzingAvis}}" hint-placeholder-val="{{ false }}">
              <div role="status" style="margin: 0 24px 20px; border: 1px solid #E4E7EC; border-radius: 12px; padding: 18px 20px; display: flex; align-items: center; gap: 12px">
                <span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid #D0D5DD; border-top-color: #101828; box-sizing: border-box; flex: none"></span>
                <span style="color: #344054">Avis d’imposition reçu · vérification de tout le lot en cours…</span>
              </div>
            </sc-if>
            <sc-if value="{{showDiff}}" hint-placeholder-val="{{ false }}">
              <div style="margin: 0 24px 20px; border: 1px solid #E4E7EC; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 18px">
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #17804A"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#17804A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Document lisible, du bon type et de la bonne année</span>
                  <h3 style="margin: 0; font-size: 17px; font-weight: 600">Le nom ne correspond pas à la pièce d’identité</h3>
                </div>
                <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
                  <div style="border: 1px solid #EAECF0; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
                    <span style="font-size: 12px; color: #667085">Pièce d’identité · validée le 12/06</span>
                    <span style="font-size: 16px"><span style="font-weight: 700; color: #B54708">MARTIN</span> Marie</span>
                  </div>
                  <div style="border: 1px solid #EAECF0; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
                    <span style="font-size: 12px; color: #667085">Avis d’imposition · déposé à l’instant</span>
                    <span style="font-size: 16px"><span style="font-weight: 700; color: #B54708">DUPONT</span> Marie</span>
                  </div>
                </div>

                <sc-if value="{{isQuestion}}" hint-placeholder-val="{{ true }}">
                  <div style="border-top: 1px solid #EAECF0; padding-top: 18px; display: flex; flex-direction: column; gap: 12px">
                    <span style="font-size: 16px; font-weight: 600">Votre cliente a-t-elle changé de nom (mariage, divorce, veuvage) ?</span>
                    <span style="color: #475467">Elle peut utiliser son nom d’usage sur certaines pièces et son nom de naissance sur d’autres.</span>
                    <div style="display: flex; flex-wrap: wrap; gap: 10px">
                      <button type="button" onClick="{{answerYes}}" style="background: #101828; color: #FFFFFF; border: 0; border-radius: 8px; padding: 0 18px; height: 44px; font-weight: 600; font-size: 14px; cursor: pointer">Oui, elle a changé de nom</button>
                      <button type="button" onClick="{{answerNo}}" style="background: #FFFFFF; color: #101828; border: 1px solid #D0D5DD; border-radius: 8px; padding: 0 18px; height: 44px; font-weight: 600; font-size: 14px; cursor: pointer">Non</button>
                    </div>
                  </div>
                </sc-if>

                <sc-if value="{{isNo}}" hint-placeholder-val="{{ false }}">
                  <div style="border-top: 1px solid #EAECF0; padding-top: 18px; display: flex; flex-direction: column; gap: 12px">
                    <span style="font-size: 16px; font-weight: 600">Dans ce cas, l’un des deux noms est sans doute erroné</span>
                    <div style="display: flex; flex-wrap: wrap; gap: 10px">
                      <button type="button" onClick="{{restart}}" style="background: #101828; color: #FFFFFF; border: 0; border-radius: 8px; padding: 0 18px; height: 44px; font-weight: 600; font-size: 14px; cursor: pointer">Déposer un autre avis d’imposition</button>
                      <button type="button" style="background: #FFFFFF; color: #101828; border: 1px solid #D0D5DD; border-radius: 8px; padding: 0 18px; height: 44px; font-weight: 600; font-size: 14px; cursor: pointer">Corriger le nom dans le dossier</button>
                      <button type="button" onClick="{{contest}}" style="background: #FFFFFF; color: #101828; border: 1px solid #D0D5DD; border-radius: 8px; padding: 0 18px; height: 44px; font-weight: 600; font-size: 14px; cursor: pointer">Signaler une erreur de lecture</button>
                    </div>
                    <button type="button" onClick="{{backToQuestion}}" style="align-self: flex-start; background: transparent; border: 0; padding: 0; color: #1D4ED8; text-decoration: underline; font-size: 13px; cursor: pointer; min-height: 32px">← Revenir à la question</button>
                  </div>
                </sc-if>

                <sc-if value="{{showRequest}}" hint-placeholder-val="{{ false }}">
                  <div style="border-top: 1px solid #EAECF0; padding-top: 18px; display: flex; flex-direction: column; gap: 12px">
                    <div style="display: flex; flex-direction: column; gap: 4px">
                      <span style="font-size: 12px; font-weight: 600; color: #667085; text-transform: uppercase; letter-spacing: 0.04em">Pièce demandée</span>
                      <span style="font-size: 16px; font-weight: 600">Livret de famille</span>
                      <span style="color: #475467">La page des époux, lisible, où figurent le nom de naissance (Martin) et le nom d’usage (Dupont).</span>
                    </div>
                    <sc-if value="{{isRequest}}" hint-placeholder-val="{{ true }}">
                      <div style="border: 1.5px dashed #98A2B3; border-radius: 12px; padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#475467" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"></path><path d="m7 9 5-5 5 5"></path><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path></svg>
                        <span style="color: #344054">Glissez le livret de famille ici</span>
                        <button type="button" onClick="{{uploadLivret}}" style="background: #101828; color: #FFFFFF; border: 0; border-radius: 8px; padding: 0 18px; height: 44px; font-weight: 600; font-size: 14px; cursor: pointer">Choisir un fichier</button>
                      </div>
                    </sc-if>
                    <sc-if value="{{isAnalyzing}}" hint-placeholder-val="{{ false }}">
                      <div role="status" style="border: 1px solid #EAECF0; border-radius: 12px; padding: 18px; display: flex; align-items: center; gap: 12px">
                        <span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid #D0D5DD; border-top-color: #101828; box-sizing: border-box; flex: none"></span>
                        <span style="color: #344054">Livret de famille reçu · vérification de tout le lot en cours…</span>
                      </div>
                    </sc-if>
                    <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #475467">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#475467" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
                      La demande a aussi été envoyée à Marie Dupont par email : elle peut déposer la pièce directement dans son espace client.
                    </span>
                  </div>
                </sc-if>
              </div>
            </sc-if>
            <sc-if value="{{isContested}}" hint-placeholder-val="{{ false }}">
              <div role="status" style="margin: 0 24px 20px; border: 1px solid #E4E7EC; border-radius: 12px; padding: 16px 20px; display: flex; flex-direction: column; gap: 4px">
                <span style="font-weight: 600">Signalement transmis</span>
                <span style="color: #475467">Un conseiller ECAIR vérifie ce point et vous répond sous 48 h. Vous n’avez rien à redéposer d’ici là.</span>
              </div>
            </sc-if>
          </sc-if>
        </div>
      </sc-for>

      <div style="padding: 14px 24px; display: flex; justify-content: flex-end">
        <button type="button" onClick="{{reset}}" style="background: transparent; border: 0; color: #667085; font-size: 12px; text-decoration: underline; cursor: pointer; min-height: 32px">Rejouer le scénario</button>
      </div>
    </section>
  </main>
</div>
</template>
<script>
(function(){
  var HOLE=/\{\{\s*([^}]+?)\s*\}\}/g;
  function resolve(path, scope){ var parts=path.trim().split('.'); var v=scope; for(var i=0;i<parts.length;i++){ if(v==null) return undefined; v=v[parts[i]]; } return v; }
  function interp(str, scope){ return str.replace(HOLE, function(_, p){ var v=resolve(p, scope); return v==null ? '' : String(v); }); }
  function evalHole(str, scope){ if(str==null) return undefined; var m=str.match(/^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/); return m ? resolve(m[1], scope) : str; }
  function renderList(nodes, scope){ var out=[]; for(var i=0;i<nodes.length;i++){ out.push.apply(out, renderNode(nodes[i], scope)); } return out; }
  function renderNode(n, scope){
    if(n.nodeType===3){ return [document.createTextNode(interp(n.nodeValue, scope))]; }
    if(n.nodeType!==1) return [];
    var tag=n.localName;
    if(tag==='sc-for'){ var list=evalHole(n.getAttribute('list'), scope)||[]; var as=n.getAttribute('as')||'item'; var res=[]; for(var i=0;i<list.length;i++){ var sc=Object.create(scope); sc[as]=list[i]; res.push.apply(res, renderList(n.childNodes, sc)); } return res; }
    if(tag==='sc-if'){ return evalHole(n.getAttribute('value'), scope) ? renderList(n.childNodes, scope) : []; }
    var el=document.createElementNS(n.namespaceURI, tag);
    var dv=null;
    for(var a=0;a<n.attributes.length;a++){
      var at=n.attributes[a], name=at.name;
      if(name.indexOf('hint-')===0) continue;
      if(name==='onclick'){ var fn=evalHole(at.value, scope); if(typeof fn==='function') el.addEventListener('click', fn); continue; }
      if(name==='defaultvalue'){ dv=interp(at.value, scope); continue; }
      el.setAttribute(name, interp(at.value, scope));
    }
    var kids=renderList(n.childNodes, scope);
    for(var k=0;k<kids.length;k++) el.appendChild(kids[k]);
    if(dv!=null) el.value=dv;
    return [el];
  }
  window.DCLogic=function(props){ this.props=props||{}; };
  window.DCLogic.prototype.setState=function(patch){ var p=typeof patch==='function'?patch(this.state):patch; this.state=Object.assign({}, this.state, p); window.__dcRender(); };
  window.__dcMount=function(Comp){
    var tpl=document.getElementById('tpl').content;
    var app=document.getElementById('app');
    var comp=new Comp({});
    window.__dcRender=function(){ var nodes=renderList(tpl.childNodes, comp.renderVals()); app.replaceChildren.apply(app, nodes); };
    window.__dcRender();
  };
})();
</script>
<script>
class Component extends DCLogic {
  state = { step: 'start' };

  renderVals() {
    const self = this;
    const step = this.state.step;
    const done = step === 'done';
    const row = (name, meta, kind, status, isAvis) => ({ name: name, meta: meta, status: status, isOk: kind === 'ok', isWarn: kind === 'warn', isWait: kind === 'wait', isAvis: !!isAvis });
    const pre = step === 'start' || step === 'analyzingAvis';
    const needLivret = ['request', 'analyzing', 'done'].indexOf(step) >= 0;

    let avis;
    if (step === 'start') avis = row('Avis d’imposition', 'Requis · à déposer', 'wait', 'À déposer', true);
    else if (step === 'analyzingAvis') avis = row('Avis d’imposition', 'Avis 2025 · déposé à l’instant', 'wait', 'Vérification en cours', true);
    else if (done) avis = row('Avis d’imposition', 'Avis 2025 · déposé à l’instant', 'ok', 'Conforme · nom relié par le livret de famille', true);
    else avis = row('Avis d’imposition', 'Avis 2025 · déposé à l’instant', 'warn', step === 'contested' ? 'En vérification par ECAIR' : '1 point à régler', true);

    const rows = [
      row('Pièce d’identité', 'CNI · déposée le 12/06', 'ok', 'Reçue et conforme'),
      row('Justificatif de propriété', 'Taxe foncière · déposée le 12/06', 'ok', 'Reçu et conforme'),
      avis
    ];
    if (needLivret) rows.push(done ? row('Livret de famille', 'Déposé à l’instant', 'ok', 'Reçu et conforme') : row('Livret de famille', 'Demandé à l’instant · requis car le nom d’usage diffère du nom de naissance', 'wait', 'À déposer'));
    rows.push(row('Avis d’imposition du locataire', 'Déposé le 14/06', 'ok', 'Reçu et conforme'));
    rows.push(row('Justificatif de domicile du locataire', 'Déposé le 14/06', 'ok', 'Reçu et conforme'));

    const total = needLivret ? 6 : 5;
    const okCount = rows.filter((r) => r.isOk).length;

    return {
      rows: rows,
      progress: okCount + ' pièces sur ' + total + ' cohérentes',
      isDone: done,
      isStart: step === 'start',
      isAnalyzingAvis: step === 'analyzingAvis',
      showDiff: ['question', 'no', 'request', 'analyzing'].indexOf(step) >= 0,
      isQuestion: step === 'question',
      isNo: step === 'no',
      showRequest: step === 'request' || step === 'analyzing',
      isRequest: step === 'request',
      isAnalyzing: step === 'analyzing',
      isContested: step === 'contested',
      uploadAvis: () => { self.setState({ step: 'analyzingAvis' }); setTimeout(() => self.setState({ step: 'question' }), 1300); },
      answerYes: () => self.setState({ step: 'request' }),
      answerNo: () => self.setState({ step: 'no' }),
      backToQuestion: () => self.setState({ step: 'question' }),
      restart: () => self.setState({ step: 'start' }),
      uploadLivret: () => { self.setState({ step: 'analyzing' }); setTimeout(() => self.setState({ step: 'done' }), 1400); },
      contest: () => self.setState({ step: 'contested' }),
      reset: () => self.setState({ step: 'start' })
    };
  }
}
window.__dcMount(Component);
</script>
</body>
</html>
